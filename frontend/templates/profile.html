<h4><a href="#!/dashboard" style="text-decoration:none;" > << Back  </a> </h4>
<h2 style="text-align:cenetr;" >Edit Profile</h2>
<form ng-submit="updateProfile()">
    <input type="text" ng-model="profile.name" placeholder="Full Name" required>
    <input type="email" ng-model="profile.email" placeholder="Email" required>
    <button type="submit">Update Profile</button>
</form>
<p class="success" ng-if="success">{{success}}</p>
<p class="error" ng-if="error">{{error}}</p>
