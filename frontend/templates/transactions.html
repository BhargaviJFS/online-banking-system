<h4><a href="#!/dashboard" style="text-decoration:none;" > << Back  </a> </h4>
<h2>Transaction History</h2>
<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Amount (₹)</th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="txn in transactions">
            <td>{{txn.date}}</td>
            <td>{{txn.type | uppercase}}</td>
            <td>{{txn.amount}}</td>
        </tr>
    </tbody>
</table>
<p class="error" ng-if="error">{{error}}</p>
